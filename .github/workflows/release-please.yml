name: Release Please

on:
  # Manual trigger while getting started. When ready to go automatic, see
  # the migration note at the bottom of this file.
  workflow_dispatch:

permissions:
  contents: write # Required: push version bump commits and CHANGELOG updates
  pull-requests: write # Required: create/update the Release PR

jobs:
  release-please:
    name: Run Release Please
    runs-on: ubuntu-latest

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}

    steps:
      # Mint an installation token from a GitHub App so the Release PR is
      # attributed to the app (not `github-actions[bot]`). PRs and pushes made
      # with `GITHUB_TOKEN` do NOT trigger other workflows — using an app token
      # is what lets `conventional-commits.yml` (and any tag-triggered release
      # workflow) actually run against release-please's outputs.
      #
      # Required repo secrets:
      #   RELEASE_PLEASE_APP_ID          — numeric App ID
      #   RELEASE_PLEASE_APP_PRIVATE_KEY — full contents of the App's .pem private key
      #
      # The App must be installed on this repo with these repository permissions:
      #   Contents: read & write      (push version-bump commit + tags)
      #   Pull requests: read & write (create/update the Release PR)
      #   Issues: read & write        (release notes)
      - name: Mint GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.app-token.outputs.token }}

      # When release-please's second run actually creates a Release + tag,
      # the tag push triggers `release-on-tag.yml` automatically (because
      # the push is attributed to the GitHub App, not GITHUB_TOKEN). That
      # workflow is now the home for build/deploy/notify steps — keep the
      # division of labor clean by NOT adding post-release steps here.

# ─────────────────────────────────────────────────────────────────────────────
# MIGRATION: When ready to release automatically on every merge to master
# that touches next-app-level-editor/ or phil-game/, replace the `on:` block above with:
#
# on:
#   push:
#     branches:
#       - master
#     paths:
#       - 'next-app-level-editor/**'
#       - 'phil-game//**'
#
# After enabling this, release-please will open/update a Release PR automatically.
# The actual GitHub Release is only created when that Release PR is merged.
# ─────────────────────────────────────────────────────────────────────────────
