name: Release on Tag

# Fires automatically when release-please pushes a tag, which happens on
# release-please's second run (after the Release PR is merged).
#
# release-please-config.json declares multiple packages (`phil-game` and
# `next-app-level-editor`, the latter aliased to `level-editor` via
# `package-name`), so release-please runs in manifest/multi-component mode
# and prefixes tags with the component name and a `-` separator — e.g.
# `phil-game-v1.2.0`, `level-editor-v1.2.0`. The patterns below match that
# scheme. If you ever add a third component, add its tag pattern here too.
#
# IMPORTANT: this only fires automatically because release-please uses a
# GitHub App token to push the tag. If you revert release-please to
# `secrets.GITHUB_TOKEN`, tag pushes will stop triggering workflows.

on:
  push:
    tags:
      - "phil-game-v[0-9]+.[0-9]+.[0-9]+"
      - "level-editor-v[0-9]+.[0-9]+.[0-9]+"

  # Manual trigger for retrying a tag-based run without re-pushing the tag.
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual run (optional)"
        required: false

permissions:
  contents: read

jobs:
  release:
    name: Tag-based release
    runs-on: ubuntu-latest
    steps:
      - name: Show triggering ref
        run: |
          echo "Triggered by: $GITHUB_REF"
          echo "Tag: ${GITHUB_REF#refs/tags/}"
          echo ""
          echo "Add real release steps here:"
          echo "  - Build production bundle"
          echo "  - Upload artifacts to the GitHub Release"
          echo "  - Deploy to staging or production"
          echo "  - Notify Slack / teams"
