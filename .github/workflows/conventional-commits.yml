name: Enforce Conventional Commits

# Validates that the PR *title* is a conventional commit.
#
# Why the PR title (not the commits):
#   The repo squash setting `squash_merge_commit_title = PR_TITLE` (GitHub UI:
#   "Pull request title and commit details") always uses the PR title as the
#   squash commit's subject on `main`, regardless of how many commits the PR
#   has. That squash subject is what release-please reads to compute the
#   version bump — so the PR title is the thing that must be a valid
#   conventional commit. Individual commit subjects are irrelevant here, and
#   there is no longer any reason to require a single commit per PR.
#
#   (Before the squash setting was PR_TITLE this workflow enforced a single
#   conventional *commit* per PR. That obsolete version is preserved at
#   conventional-commits.yml.deprecated for reference.)
#
# This workflow runs on every PR to `main` (no `paths:` filter on the trigger)
# so it can be marked as a required status check in branch protection. The
# path-scoping is done inside the job: if the PR touches none of the watched
# paths, the validation step is skipped and the job reports success. A
# `paths:` filter on the trigger would prevent the workflow from running at
# all on out-of-scope PRs, leaving any required check unsatisfied forever.
#
# `edited` is in the trigger types so that fixing a bad PR title re-runs the
# check — editing a title does not push a commit, so without `edited` the only
# other way to re-trigger would be to push.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-commit:
    name: Validate conventional PR title
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes in watched paths
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Paths whose changes require a conventional PR title.
          # Keep in sync with the release-please scopes.
          WATCHED='^(phil-game|next-app-level-editor)/'

          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -qE "$WATCHED"; then
            echo "Watched paths touched — will run validation."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No watched paths touched — skipping validation (reporting success)."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check PR title
        if: steps.filter.outputs.changed == 'true'
        env:
          # Pass via env (never interpolate ${{ }} straight into the script) so
          # a crafted PR title can't inject shell.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          PATTERN='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?(!)?: .{1,}'

          echo "PR title: $PR_TITLE"
          echo

          if printf '%s' "$PR_TITLE" | grep -qP "$PATTERN"; then
            echo "✅ Conventional commit: $PR_TITLE"
          else
            echo "::error::PR title is not a conventional commit."
            echo "  Got: $PR_TITLE"
            echo
            echo "The PR title becomes the squash commit subject on main"
            echo "(repo setting: squash_merge_commit_title=PR_TITLE) and is what"
            echo "release-please reads to compute the version bump, so it must be"
            echo "a conventional commit."
            echo
            echo "Expected:"
            echo "  <type>[optional scope]: <description>"
            echo
            echo "Examples:"
            echo "  feat: add bulk order assignment"
            echo "  fix(auth): handle expired session token"
            echo "  build(bazel): upgrade buildifier to 8.x"
            echo "  feat!: drop legacy API (breaking change)"
            echo
            echo "Types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert"
            echo
            echo "Only feat:, fix:, and BREAKING CHANGE / ! bump the version."
            exit 1
          fi
